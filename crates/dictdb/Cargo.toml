[package]
name = "dictdb"
description = "Compact, memory-mapped dictionary storage format with fast prefix search."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fst = "0.4.7"
lru = "0.18.5"
memmap2 = "0.9.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
zstd = "0.14.0"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "search"
harness = false
