[workspace]
members = ["crates/dictdb", "crates/import", "crates/app"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
dictdb = { path = "crates/dictdb" }
import = { path = "crates/import" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep imports and benchmarks reasonably fast in debug builds.
[profile.dev.package."*"]
opt-level = 2

# CI only tests synthetic data, so it skips the dependency optimization above,
# which makes a cold build several times slower.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 0
